# Current Pool Math tests only; Atlas supplies the live pH, temperature and salt.
# Install alongside the existing Atlas and doser packages in /config/packages/.
# Set pool_math_url in secrets.yaml to your Pool Math share JSON link.
rest:
  - resource: !secret pool_math_url
    scan_interval: 600
    timeout: 30
    sensor:
      - name: Pool Math Overview
        unique_id: pool_math_overview
        value_template: >-
          {{ 'OK' if value_json is defined and value_json is mapping
             and value_json.get('pools', []) | count > 0
             and value_json.pools[0].get('pool', {}).get('overview') is mapping
             else 'unavailable' }}
        json_attributes_path: '$.pools[0].pool.overview'
        json_attributes: [fc, fcTs, ta, taTs, cya, cyaTs, ch, chTs, bor, borTs]

# These readings are current snapshots; do not record them or calculated CSI.
recorder:
  exclude:
    entity_globs:
      - sensor.pool_math_*
    entities:
      - sensor.pool_csi

# Each test reading keeps its last valid value and test time until Pool Math
# returns a newer valid one. Trigger-based template sensors restore state and
# attributes across restarts, so a restart, outage or rate-limited request
# never blanks them. The minute trigger only refreshes the age text.
template:
  - triggers:
      - trigger: state
        entity_id: sensor.pool_math_overview
      - trigger: time_pattern
        minutes: /1
    sensor:
      - name: "Pool Math Free Chlorine"
        unique_id: pool_math_free_chlorine
        default_entity_id: sensor.pool_math_free_chlorine
        icon: mdi:flask-outline
        unit_of_measurement: ppm
        state: >-
          {% set o = 'sensor.pool_math_overview' %}
          {% set new = state_attr(o, 'fc') %}
          {% set new_at = state_attr(o, 'fcTs') %}
          {% set fresh = is_state(o, 'OK') and is_number(new)
                          and as_timestamp(new_at, none) is not none %}
          {{ new | float if fresh else this.state | float(none) }}
        attributes:
          tested_at: >-
            {% set o = 'sensor.pool_math_overview' %}
            {% set new = state_attr(o, 'fc') %}
            {% set new_at = state_attr(o, 'fcTs') %}
            {% set fresh = is_state(o, 'OK') and is_number(new)
                            and as_timestamp(new_at, none) is not none %}
            {{ new_at if fresh else this.attributes.get('tested_at') }}
          reading: >-
            {% set o = 'sensor.pool_math_overview' %}
            {% set new = state_attr(o, 'fc') %}
            {% set new_at = state_attr(o, 'fcTs') %}
            {% set fresh = is_state(o, 'OK') and is_number(new)
                            and as_timestamp(new_at, none) is not none %}
            {% set value = new | float if fresh else this.state | float(none) %}
            {% set tested = as_timestamp(new_at if fresh else this.attributes.get('tested_at'), none) %}
            {% if value is number and tested is not none %}
              {% set days = [0, ((as_timestamp(now()) - tested) / 86400) | int] | max %}
              {{ '%g' | format(value) }} ppm — {{ days }} {{ 'day' if days == 1 else 'days' }} ago
            {% else %}
              {{ none }}
            {% endif %}

