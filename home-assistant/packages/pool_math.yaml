  # CSI uses the retained test readings with live Atlas pH, temperature and salt.
  - sensor:
      # TFP's CSI equation: https://www.troublefreepool.com/calc.html (function CSI).
      # Keep full input precision; round only the result to two decimal places.
      - name: Pool CSI
        unique_id: pool_csi
        default_entity_id: sensor.pool_csi
        icon: mdi:calculator
        availability: >-
          {% set ph = states('sensor.atlas_pool_ph') | float(none) %}
          {% set temp = states('sensor.atlas_pool_temperature') | float(none) %}
          {% set salt = states('sensor.atlas_pool_salinity') | float(none) %}
          {% set ta = states('sensor.pool_math_total_alkalinity') | float(none) %}
          {% set cya = states('sensor.pool_math_cya') | float(none) %}
          {% set ch = states('sensor.pool_math_calcium_hardness') | float(none) %}
          {% set bor = states('sensor.pool_math_borates') | float(none) %}
          {% set unit = state_attr('sensor.atlas_pool_temperature', 'unit_of_measurement') %}
          {% if [ph, temp, salt, ta, cya, ch, bor] | select('is_number') | list | count == 7
                and unit in ['°C', '°F']
                and state_attr('sensor.atlas_pool_salinity', 'unit_of_measurement') == 'ppm'
                and 6 <= ph <= 9 and ch > 0 and ta >= 0 and cya >= 0 and bor >= 0 and salt >= 0 %}
            {% set celsius = (temp - 32) * 5 / 9 if unit == '°F' else temp %}
            {% set carbonate_alkalinity = ta - 0.38772 * cya / (1 + 10 ** (6.83 - ph))
                                             - 4.63 * bor / (1 + 10 ** (9.11 - ph)) %}
            {{ celsius > -273.15 and carbonate_alkalinity > 0 }}
          {% else %}
            false
          {% endif %}
        state: >-
          {% set ph = states('sensor.atlas_pool_ph') | float(none) %}
          {% set temp = states('sensor.atlas_pool_temperature') | float(none) %}
          {% set salt = states('sensor.atlas_pool_salinity') | float(none) %}
          {% set ta = states('sensor.pool_math_total_alkalinity') | float(none) %}
          {% set cya = states('sensor.pool_math_cya') | float(none) %}
          {% set ch = states('sensor.pool_math_calcium_hardness') | float(none) %}
          {% set bor = states('sensor.pool_math_borates') | float(none) %}
          {% set unit = state_attr('sensor.atlas_pool_temperature', 'unit_of_measurement') %}
          {% if [ph, temp, salt, ta, cya, ch, bor] | select('is_number') | list | count == 7
                and unit in ['°C', '°F'] and ch > 0 and 6 <= ph <= 9
                and ta >= 0 and cya >= 0 and bor >= 0 and salt >= 0 %}
            {% set celsius = (temp - 32) * 5 / 9 if unit == '°F' else temp %}
            {% set carbonate_alkalinity = ta - 0.38772 * cya / (1 + 10 ** (6.83 - ph))
                                             - 4.63 * bor / (1 + 10 ** (9.11 - ph)) %}
            {% set extra_salt = [salt - 1.1678 * ch, 0] | max %}
            {% set ionic_strength = (1.5 * ch + ta) / 50045 + extra_salt / 58440 %}
            {% if carbonate_alkalinity > 0 and celsius > -273.15 %}
              {% set root_ionic = sqrt(ionic_strength) %}
              {% set csi = ph - 11.677 + log(ch, 10) + log(carbonate_alkalinity, 10)
                           - 2.56 * root_ionic / (1 + 1.65 * root_ionic)
                           - 1412.5 / (celsius + 273.15) + 4.7375 %}
              {{ ((csi * 100 + 0.5) | round(0, 'floor')) / 100 }}
            {% else %}
              {{ none }}
            {% endif %}
          {% else %}
            {{ none }}
          {% endif %}
