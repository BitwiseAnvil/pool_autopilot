<text x="62" y="1138" class="t-label">14 AWG ferrules: three large red, one yellow, remaining device ends blue</text>
<text x="62" y="1165" class="t-small">Mean Well L/N, Waveshare COM/NO, detector A1/A2 and all Finder A1/A2: one 14 AWG wire in one blue ferrule.</text>
<text x="62" y="1190" class="t-small">14 AWG groups: two four-wire red, one three-wire red, one two-wire yellow and 16 single blue ends.</text>
<text x="62" y="1215" class="t-small">Kit chart: large red = 8 AWG label / 12 mm / 4.9 mm OD; yellow = 10 AWG label / 12 mm / 3.9 mm OD.</text>
<text x="62" y="1240" class="t-small">K4-14: one orange C13. K4-11: one black C14. The GPIO1/R1 branch is soldered locally at JS2; no shared ferrule at K4.</text>
<text x="62" y="1265" class="t-small">Finder 22.32 contact terminals are rated for 1 × 10 AWG or 2 × 12 AWG. K5-3 and K1-3 exceed that; use a rated neutral terminal block instead.</text>
<text x="35" y="1371" class="t-small">WIRE BY ID · follow the end-preparation notes and assembly checkout · crossings do not connect</text>
<text x="2165" y="1371" class="t-label" text-anchor="end">6 requested shared ferrules</text></svg>
