# RS485 Slave/Relay B: Waveshare ESP32-S3-Relay-1CH-U, SKU 35086.

substitutions:
  device_name: pool-doser-slave
  relay_pin: GPIO47
  rs485_tx_pin: GPIO17
  rs485_rx_pin: GPIO18
  rs485_direction_pin: GPIO21
  outlet_detect_pin: GPIO1

esphome:
  name: ${device_name}
  min_version: 2026.9.0
  includes:
    - pool_doser_control.h
    - pool_doser_rs485.h
  on_boot:
    # Reassert fail-off after GPIO initialization at priority 800.
    priority: 700
    then:
      - switch.turn_off: relay_b

esp32:
  board: esp32-s3-devkitc-1
  variant: esp32s3
  flash_size: 16MB
  toolchain: esp-idf
  framework:
    type: arduino

safe_mode:
  storage: rtc

external_components:
  - source:
      type: local
      path: ../components
    components: [pool_storage]

pool_storage:

logger:
  level: INFO
  baud_rate: 0

# The RS485 maintenance lease is the only authority to enable this radio.
wifi:
  id: slave_wifi
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  enable_on_boot: false
  reboot_timeout: 0s

ota:
  - platform: esphome
    encryption:
      key: !secret slave_ota_key
    on_begin:
      - lambda: |-
          auto &link = pool_doser::slave_link;
          pool_doser::slave_maintenance.begin_ota();
          id(relay_b).turn_off();
          link.relay_b_closed = false;
          link.active = false;
          link.active_command = 0;
    on_error:
      - lambda: |-
          pool_doser::slave_maintenance.fail_ota();
          pool_doser::slave_link.discard_input(id(rs485_uart));
          id(slave_wifi).disable();

uart:
  id: rs485_uart
  tx_pin: ${rs485_tx_pin}
  rx_pin: ${rs485_rx_pin}
  flow_control_pin: ${rs485_direction_pin}
  baud_rate: 9600
  data_bits: 8
  parity: NONE
  stop_bits: 1
  rx_buffer_size: 256

switch:
  - platform: gpio
    id: relay_b
    internal: true
    pin: ${relay_pin}
    restore_mode: ALWAYS_OFF

binary_sensor:
  - platform: gpio
    id: outlet_live
    internal: true
    pin:
      number: ${outlet_detect_pin}
      mode:
        input: true
        pullup: true
      inverted: true
    filters:
      - delayed_on: 100ms
      - delayed_off: 200ms

interval:
  - interval: 20ms
    then:
      - lambda: |-
          auto &link = pool_doser::slave_link;
          link.poll(id(rs485_uart));
          link.observe_outlet(id(outlet_live).state);
          link.check_idle_output(id(outlet_live).has_state());
          if (link.peer_changed) {
            id(relay_b).turn_off();
            link.relay_b_closed = link.active = false;
            link.active_command = 0;
            link.peer_changed = false;
            // Preserve physical latches; a controller session change ends delivery.
            if (!pool_doser::physical_fault(link.fault)) link.fault = pool_doser::FAULT_INTERRUPTED;
          }

          // Test 1: B must open if voltage appears while A is open.
          if (link.active && link.active_command == pool_doser::TEST_CLOSE_B &&
              link.outlet_live) {
            id(relay_b).turn_off();
            link.relay_b_closed = false;
            link.active = false;
            link.active_command = 0;
            link.fault = pool_doser::FAULT_POWER_DURING_A_OPEN_TEST;
          }

          // A opening on Master power loss precedes the link timeout. Loss of
          // voltage alone proves an interrupted delivery, not a welded relay.
          if (link.active && link.active_command == pool_doser::DOSE_B &&
              link.output_proven && !link.outlet_live && link.remaining() > 250) {
            id(relay_b).turn_off();
            link.relay_b_closed = false;
            link.active = false;
            link.active_command = 0;
            link.fault = pool_doser::FAULT_INTERRUPTED;
            link.invalidate_delivery();
          }

          if (link.active && link.remaining() == 0) {
            id(relay_b).turn_off();
            link.relay_b_closed = false;
            link.active = false;
            link.active_command = 0;
          }

          if (link.active && !link.connected()) {
            id(relay_b).turn_off();
            link.relay_b_closed = false;
            link.active = false;
            link.active_command = 0;
            if (!pool_doser::physical_fault(link.fault)) link.fault = pool_doser::FAULT_LINK_LOST;
            link.invalidate_delivery();
          }

          auto &maintenance = pool_doser::slave_maintenance;
          maintenance.expire();
          if (link.frame_ready) maintenance.observe(link.received);
          if (maintenance.blocks_dosing()) {
            id(relay_b).turn_off();
            link.relay_b_closed = false;
            link.active = false;
            link.active_command = 0;
          }
          // Open B before enabling Wi-Fi; a live/unknown detector also inhibits it.
          const bool enable_wifi = maintenance.wants_wifi(
            !link.active && !link.relay_b_closed &&
            id(outlet_live).has_state() && !link.outlet_live);
          if (enable_wifi && id(slave_wifi).is_disabled())
            id(slave_wifi).enable();
          else if (!enable_wifi && !id(slave_wifi).is_disabled())
            id(slave_wifi).disable();

          if (!link.frame_ready) return;
          const auto frame = link.received;
          link.frame_ready = false;
          const bool is_status = frame.command == pool_doser::STATUS_REQUEST;
          if (is_status && !link.active && !link.relay_b_closed &&
              id(outlet_live).has_state() && !link.outlet_live &&
              pool_doser::interruption_fault(link.fault)) link.fault = pool_doser::FAULT_NONE;
          const bool duplicate = link.is_duplicate_command(frame);

          if (!is_status && !duplicate) {
            link.remember_command(frame);
            switch (frame.command) {
              case pool_doser::OPEN_B:
              case pool_doser::ABORT_B:
                if (frame.transaction == link.transaction && frame.command == pool_doser::OPEN_B &&
                    link.transaction_stage == 1) link.transaction_stage = 2;
                if (frame.command == pool_doser::ABORT_B) link.invalidate_delivery();
                id(relay_b).turn_off();
                link.relay_b_closed = false;
                link.active = false;
                link.active_command = 0;
                break;
              case pool_doser::CLEAR_FAULT:
                id(relay_b).turn_off();
                link.relay_b_closed = false;
                link.active = false;
                link.active_command = 0;
                if (maintenance.blocks_dosing() && id(outlet_live).has_state() && !link.outlet_live)
                  link.fault = pool_doser::FAULT_NONE;
                break;
              case pool_doser::PROBE_STATUS:
                // Non-mutating command-specific probe.
                break;
              case pool_doser::TEST_CLOSE_B:
                if (maintenance.blocks_dosing() || !id(slave_wifi).is_disabled()) {
                  // Maintenance is independent of CLEAR_FAULT and duplicate ACKs.
                  break;
                } else if (link.active) {
                  id(relay_b).turn_off();
                  link.relay_b_closed = false;
                  link.active = false;
                  link.active_command = 0;
                  if (!pool_doser::physical_fault(link.fault)) link.fault = pool_doser::FAULT_BAD_COMMAND;
                } else if (link.fault != pool_doser::FAULT_NONE) {
                  id(relay_b).turn_off();
                  link.relay_b_closed = false;
                  link.active = false;
                  link.active_command = 0;
                } else if (frame.duration_ms == 0 || frame.duration_ms > 2000) {
                  id(relay_b).turn_off();
                  link.relay_b_closed = false;
                  link.active = false;
                  link.active_command = 0;
                  if (!pool_doser::physical_fault(link.fault)) link.fault = pool_doser::FAULT_BAD_COMMAND;
                } else if (!link.begin_transaction(frame)) {
                  break;
                } else {
                  link.output_proven = false;
                  link.active = true;
                  link.active_command = pool_doser::TEST_CLOSE_B;
                  link.deadline_ms = millis() + frame.duration_ms;
                  id(relay_b).turn_on();
                  link.relay_b_closed = true;
                }
                break;
              case pool_doser::DOSE_B:
                if (maintenance.blocks_dosing() || !id(slave_wifi).is_disabled()) {
                  break;
                } else if (link.active) {
                  id(relay_b).turn_off();
                  link.relay_b_closed = false;
                  link.active = false;
                  link.active_command = 0;
                  if (!pool_doser::physical_fault(link.fault)) link.fault = pool_doser::FAULT_BAD_COMMAND;
                } else if (link.fault != pool_doser::FAULT_NONE) {
                  id(relay_b).turn_off();
                  link.relay_b_closed = false;
                  link.active = false;
                  link.active_command = 0;
                } else if (frame.duration_ms < pool_doser::MIN_DOSE_MS ||
                    frame.duration_ms > pool_doser::MAX_DOSE_MS) {
                  id(relay_b).turn_off();
                  link.relay_b_closed = false;
                  link.active = false;
                  link.active_command = 0;
                  if (!pool_doser::physical_fault(link.fault)) link.fault = pool_doser::FAULT_BAD_COMMAND;
                } else if (!link.begin_transaction(frame)) {
                  break;
                } else {
                  link.output_proven = false;
                  link.active = true;
                  link.active_command = pool_doser::DOSE_B;
                  link.deadline_ms = millis() + frame.duration_ms;
                  id(relay_b).turn_on();
                  link.relay_b_closed = true;
                }
                break;
              default:
                if (!pool_doser::physical_fault(link.fault)) link.fault = pool_doser::FAULT_BAD_COMMAND;
                id(relay_b).turn_off();
                link.relay_b_closed = false;
                link.active = false;
                link.active_command = 0;
                break;
            }
          }

          uint16_t flags = 0;
          if (link.relay_b_closed) flags |= pool_doser::RELAY_B_CLOSED;
          if (link.outlet_live) flags |= pool_doser::OUTLET_LIVE;
          if (link.active) flags |= pool_doser::B_ACTIVE;
          if (link.fault != pool_doser::FAULT_NONE) flags |= pool_doser::B_FAULT;
          if (link.output_proven) flags |= pool_doser::B_OUTPUT_PROVEN;
          if (maintenance.blocks_dosing()) flags |= pool_doser::MAINTENANCE_LOCKED;
          if (!id(slave_wifi).is_disabled()) flags |= pool_doser::B_WIFI_ENABLED;
          if (!maintenance.blocks_dosing() && id(slave_wifi).is_disabled())
            flags |= pool_doser::B_DOSING_READY;
          // Diagnostic only: never start Wi-Fi to obtain a signal reading.
          if (enable_wifi && id(slave_wifi).is_connected())
            flags |= pool_doser::encode_wifi_rssi(id(slave_wifi).wifi_rssi());
          // Echo request sequence in STATUS_RESPONSE.duration_ms.
          link.send(id(rs485_uart), pool_doser::STATUS_RESPONSE,
                    link.transaction, frame.sequence, flags, link.remaining(),
                    0, link.fault);
